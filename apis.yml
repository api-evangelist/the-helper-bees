aid: the-helper-bees
name: The Helper Bees
description: >-
  The Helper Bees is an Austin-based aging-in-place technology company that
  operates one connected platform linking benefits, in-home service providers,
  and support so older adults can safely age at home. Its products include Care
  Concierge human guidance, an Aging-in-Place Marketplace for OTC products and
  nonmedical services (home care, safety modifications, meals, transportation),
  the Helpful benefits card, digital invoicing and claims processing for home
  and facility care, and digital nurse eligibility assessments for long-term
  care insurance. The company runs one of the nation's largest networks of
  vetted in-home care agencies and sells to Long-Term Care Insurance, Medicare
  Advantage, and Medicaid plan administrators. It was surfaced as a Techstars
  portfolio company and added to the API Evangelist network. The Helper Bees
  publishes member and provider applications (the api.thehelperbees.com app
  host, the myhomealign.com provider portal, and mobile apps) but does not
  currently expose a public developer program, OpenAPI specification, or SDKs.
